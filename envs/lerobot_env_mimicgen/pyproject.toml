[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_env_mimicgen"
version = "0.1.0"
description = "LeRobot environment plugin for MimicGen tasks"
requires-python = ">=3.12"
dependencies = ["lerobot", "gymnasium", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_env_mimicgen"]
